services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: leadpitch
      POSTGRES_USER: leadpitch
      POSTGRES_PASSWORD: leadpitch
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadpitch -d leadpitch"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    command: ["sh", "-c", "python -m app.migrate && hypercorn 'app:create_app()' --bind 0.0.0.0:8000"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-replace-with-a-long-random-secret}
      DATABASE_URL: postgresql+asyncpg://leadpitch:leadpitch@postgres:5432/leadpitch
      REDIS_URL: redis://redis:6379/0
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"

  worker:
    build: ./backend
    command: python -m app.worker
    environment:
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-replace-with-a-long-random-secret}
      DATABASE_URL: postgresql+asyncpg://leadpitch:leadpitch@postgres:5432/leadpitch
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  postgres_data:
  redis_data:
